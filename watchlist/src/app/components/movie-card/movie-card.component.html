<div class="card" [class.watched]="isWatched">
  
  <!-- Badge Vu -->
  <div class="watched-badge" *ngIf="isWatched">Vu</div>

  <img [src]="movie.image" [alt]="movie.title" />

  <div class="content">
    <h3>{{ movie.title }} ({{ movie.year }})</h3>

    <div class="rating">
      @for (star of [].constructor(movie.rating); track $index) {
        ⭐
      }
    </div>

    <div class="actions">
      <button (click)="rate.emit(1)">+</button>
      <button (click)="rate.emit(-1)">−</button>
      <button (click)="onToggleWatched()">👁</button>
      <button (click)="delete.emit(movie.id)">🗑</button>
    </div>
  </div>
</div>
