<div class="container">

  <div class="grid">
    @for (movie of movieService.movies; track movie.id) {
      <app-movie-card
        [movie]="movie"
        (delete)="movieService.deleteMovie($event)"
        (rate)="movieService.updateRating(movie.id, $event)"
        (toggle)="movieService.toggleWatched($event)"
      />
    }
    @empty {
      <p class="empty">Aucun film</p>
    }
  </div>

</div>
